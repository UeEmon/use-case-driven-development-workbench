name: labels

# Issue テンプレートで使うラベルを作成（既にあれば何もしない）
on:
  push:
    branches: [main]
    paths: [".github/workflows/labels.yml"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "usecase", color: "1f6feb", description: "ユースケースの追加・変更" },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
                core.info(`created: ${l.name}`);
              } catch (e) {
                if (e.status === 422) core.info(`exists: ${l.name}`);
                else throw e;
              }
            }
